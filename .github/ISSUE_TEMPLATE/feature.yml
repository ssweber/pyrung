name: Feature request
description: Something pyrung should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The ladder problem, not the feature. What are you building and where does pyrung get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd want it to look like
      description: Optional. A code sketch is ideal.
      render: python
