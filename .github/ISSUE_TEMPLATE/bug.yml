name: Bug report
description: pyrung did something wrong, or something different from a CLICK PLC
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: Smallest program that shows it
      description: A few rungs and the steps or test that trigger the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output or traceback.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: pyrung and Python versions
      placeholder: pyrung 0.13.0, Python 3.12, Windows 11
    validations:
      required: true
  - type: input
    id: click
    attributes:
      label: CLICK details, if it involves a PLC
      placeholder: CLICK Programming Software v3.90, C2-03CPU
