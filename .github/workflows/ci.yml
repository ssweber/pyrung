# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

# This workflow does not run on a push to main. A PR must be up to date to merge, so its
# own run already tested the code that merges.
on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        # The oldest and newest supported Python. The bytecode job covers the ones between.
        python-version: ["3.11", "3.14"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Update this as needed:
          version: "0.13.8"
          enable-cache: auto
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --locked --all-extras --dev

      - name: Report locked tool versions
        run: uv run python -c "import importlib.metadata as md; print('ruff', md.version('ruff')); print('ty', md.version('ty'))"

      - name: Run linting
        run: uv run python devtools/lint.py --check

      - name: Run tests
        # Same selection and options as local `make test` (markers, --ignore,
        # --runner-backend=both); edit the Makefile target, not this step.
        run: make test
        env:
          PYTEST_WORKERS: auto

  # Reading bytecode (opcode names, `executing`'s node lookup) can break on any Python release,
  # so the tests of that code also run on the versions between the oldest and the newest.
  bytecode:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the package version comes from git tags

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: auto
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install all dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run the bytecode tests
        # The file list is BYTECODE_TESTS in the Makefile.
        run: make test-bytecode

  # main requires only this check, so the matrix can change without editing branch protection.
  # Without always(), a failed build would skip this job. A skipped required check counts
  # as passing. A new test job must go into needs and into the test below, or ci passes
  # without it.
  ci:
    if: always()
    needs: [build, bytecode]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = "success" && test "${{ needs.bytecode.result }}" = "success"
