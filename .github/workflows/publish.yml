name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Enable manual trigger.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: write # Upload release assets.
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install all dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check that the commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not on main. Merge it to main, then publish from a tag or run on main."
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Check the built wheel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck dist/*.whl
          version=$(/tmp/wheelcheck/bin/python -c "import importlib.metadata, pyrung; print(importlib.metadata.version('pyrung'))")
          echo "Built wheel reports version $version"
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then
            echo "::error::The wheel is version $version but the release tag is $TAG. Fix the tag or the version source and publish again."
            exit 1
          fi

      - name: Publish to PyPI (using uv)
        uses: pypa/gh-action-pypi-publish@release/v1

      # --- Release assets ---

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build release assets (starter zip + VSIX)
        run: uv run python devtools/build_release_assets.py --out-dir dist/assets

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/assets/* --clobber

  docs:
    name: Deploy the release's docs
    # This job runs after the publish job succeeds. A pre-release skips it.
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy docs from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run docs.yml --ref main -f ref="$TAG"
