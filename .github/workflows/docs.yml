name: Docs

# The public site describes the latest release, not main. A pull request builds and
# checks the docs, with no deploy. A deploy is a workflow_dispatch on main. publish.yml
# starts one with the release's tag. By hand, `ref` defaults to the latest release.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: the latest release)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the release to build
        id: source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "Building $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install docs dependencies
        run: uv sync --locked --group docs

      - name: Cache-bust extra assets
        # GITHUB_SHA is main's commit on a dispatch, not the commit built.
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          sed -i -E "s#^(\s*- (stylesheets|javascripts)/[^?[:space:]]+)\$#\1?v=${sha}#" mkdocs.yml
          grep -E '\?v=' mkdocs.yml

      - name: Build docs
        run: |
          uv run --no-sync python devtools/stage_docs.py docs generated-docs
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync python devtools/finalize_docs_site.py generated-docs site

      - name: Check docs routes
        run: uv run --no-sync python devtools/check_docs_site.py generated-docs site

      - name: Guard public site
        run: uv run --no-sync python .github/scripts/check_public_site.py site

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # The concurrency group is on this job, not the workflow. At workflow level, a pull
    # request's build would replace a deploy waiting its turn.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
