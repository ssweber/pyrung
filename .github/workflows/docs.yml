name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install docs dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: |
          uv run --no-sync python devtools/stage_docs.py docs generated-docs
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync python devtools/finalize_docs_site.py generated-docs site

      - name: Check docs routes
        run: uv run --no-sync python devtools/check_docs_site.py generated-docs site

      - name: Guard public site
        run: uv run --no-sync python .github/scripts/check_public_site.py site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
