# Fixed DS layout of the conformance program (see AGENTS.md, "Manifest").
#
# Each group owns a block: its header at DS<base> (the subroutine writes its
# hash there every scan), slot N at DS(base + 10*N)..DS(base + 10*N + 7).
# Never renumber or move anything: a new case takes the next index in its
# group, a removed case leaves a gap, a new group takes the next free block.
# `make test-conformance` (and build_program) prints the exact lines to add.

[groups.rungs]
base = 101 # Conf_Rungs: DS101..DS300
slots = 19

[groups.rungs.cases]
memory_is_immediate = 1
source_order = 2
global_mutation = 3

[groups.math]
base = 301 # Conf_Math: DS301..DS500
slots = 19

[groups.math.cases]
avg_mdn_positive = 1
avg_mdn_negative = 2
avg_odd_count = 3
avg_dint_no_overflow = 4
mdn_even_count = 5
max_min_word_unsigned = 6

[groups.drum]
base = 501 # Conf_Drum: DS501..DS700
slots = 19

[groups.drum.cases]
te_acc_counts_while_waiting = 1
te_level_event_already_on = 2
