# The layout of the parts with memory of their own (suite.APART_PARTS).
# It shares nothing with manifest.toml, which has no room left: these registers may repeat
# the suite's, since these groups run in no project with its groups.  Rules as there:
# nothing moves, and a new case takes the next index in its group.

[groups.unit_pairs]
base = 101 # Conf_UnitPairs: DS101..DS150
slots = 4

[groups.unit_pairs.cases]
one_second = 1
three_seconds = 2

[groups.unit_minute]
base = 151 # Conf_UnitMinute: DS151..DS200
slots = 4

[groups.unit_minute.cases]
one_minute = 1
thirty_seconds = 2

[groups.fixed_scan]
base = 201 # Conf_FixedScan: DS201..DS400
slots = 19

[groups.fixed_scan.cases]
scan_setup = 1
seconds_and_ms = 2
off_delay_and_drum = 3

[groups.text_compare]
base = 401 # Conf_TextCompare: DS401..DS460
slots = 5

[groups.text_compare.cases]
txt_against_literal_and_txt = 1
never_written = 2
cleared = 3
blank_and_space = 4
blank_literal = 5

[groups.flasher_td]
base = 461 # Conf_FlasherTd: DS461..DS480
slots = 1

[groups.flasher_td.cases]
frozen_off_td_at_lowered_preset = 1
